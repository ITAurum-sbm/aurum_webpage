<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Page Background</title>
    <style>
        body {
            background-image: url('aurum.jpg'); 
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden; 
        }

        .content
        {
            color: rgb(29, 4, 251);
            font-family: sans-serif;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            padding-top: 20px; 
            animation: moveText 10s linear infinite;
            white-space: nowrap;
            width: max-content;
        }

        @keyframes moveText {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* CHANGED: Positioned the button container at the bottom right corner */
        .button-container {
            position: fixed;
            bottom: 25px; /* Distance from the bottom edge */
            right: 25px;  /* Distance from the right edge */
            z-index: 1000; /* Ensures it stays on top of other content */
        }

        .my-link-button {
            background-color: rgb(29, 4, 251);
            color: white;
            padding: 12px 24px;
            text-decoration: none; /* Removes the default underline */
            font-family: sans-serif;
            font-weight: bold;
            border-radius: 5px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s;
            display: inline-block; /* Ensures padding behaves correctly */
        }

        .my-link-button:hover {
            background-color: rgb(20, 3, 180); /* Darkens slightly when hovered */
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Welcome to Aurum</h1>
    </div>

    <!-- The container and link button are now fixed to the bottom right -->
    <div class="button-container">
        <a href="html2.html" class="my-link-button">Enquiry</a>
    </div>

</body>
</html>
